<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1916 821" role="img" aria-labelledby="title desc">
  <title id="title">Research Publications</title>
  <desc id="desc">Research portfolio banner covering artificial intelligence, autonomous systems, cybersecurity, and software engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.48" stop-color="#09213a"/>
      <stop offset="1" stop-color="#03101e"/>
